services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cloudgaming-api:latest
    container_name: cloudgaming-api
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  autoscaler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cloudgaming-api:latest
    container_name: cloudgaming-autoscaler
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "-m", "scripts.autoscale"]
    depends_on:
      - api
