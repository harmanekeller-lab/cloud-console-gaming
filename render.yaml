services:
  - type: web
    name: cloud-console-gaming
    runtime: python
    pythonVersion: 3.10.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:main --host 0.0.0.0 --port $PORT || uvicorn app:api --host 0.0.0.0 --port $PORT || uvicorn app:app --host 0.0.0.0 --port $PORT
  
